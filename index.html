<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/main.css" type="text/css" />
    <script  src="./resources/jquery.min.js"></script>
    <script src="./scripts/main.js"></script>

   
</head>

<h1>
    Using jQuery Selectors and Events!
</h1>

<main>
    <section>
        
        <p id="freshText">
            I am a sentence.
        </p>
        
        <button id="changeTextBtn">Click Me A LOT!</button>
        <button id="hideTextBtn">Make it...Disappear!</button>
        <button id="showTextBtn">Bring it Back!</button>

        <!-- This Section Represents Changing a Sentence using Interactive Buttons-->

    </section>


    <section>
        <div class="color-box" id="box">Hover Over Me!</div>

        <!-- This Section represents the Hover Button -->
    </section>

    <section>
         
        <button id="animateBtn">YEAAAHHH!</button>
    
        <img id="animateBox" src="./images/fred_durst.jpeg" alt="Limp Bizkit!">

        <!--This Section represents animating an Image on the Webpage 
        when a Button is clicked-->

    </section>
</main>
